<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Star Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#eef1f6;--card:#fff;--text:#0f1722;--mut:#7b8794;--line:#e3e8ef;--tile:linear-gradient(145deg,#f3f6fb,#e8eef8);--acc:#2f8cff;--acc2:#7a5cff;--gold:#ffb020}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#1a1f29;--text:#f1f4f9;--mut:#8b96a5;--line:#2a313d;--tile:linear-gradient(145deg,#232a36,#1d232d)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding:12px 12px 100px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:22px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 28px rgba(80,90,255,.28)}
.hero small{opacity:.8;font-size:12px;letter-spacing:.4px}
.hero .amt{font-size:26px;font-weight:800;margin-top:2px}
.hero button{border:0;background:rgba(255,255,255,.22);color:#fff;padding:9px 14px;border-radius:999px;font:inherit;font-weight:700;backdrop-filter:blur(6px)}
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:16px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px 2px;border-radius:12px;font:inherit;font-weight:700;font-size:13px;transition:.15s}
.tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 12px rgba(80,90,255,.3)}
.h{font-weight:800;font-size:13px;color:var(--mut);margin:4px 4px 8px;text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{position:relative;background:var(--card);border:2px solid transparent;border-radius:20px;padding:12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:.15s}
.item:active{transform:scale(.97)}
.item.sel{border-color:var(--acc);box-shadow:0 6px 18px rgba(47,140,255,.25)}
.item.sel::after{content:"✓";position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px;line-height:22px;font-weight:800}
.tile{height:84px;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:48px}
.tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ff7a45,#ff3d71);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.cnt{margin-top:9px;font-weight:800;font-size:16px}
.cnt span{color:var(--gold)}
.pr{color:var(--mut);font-weight:700;margin-top:1px;font-size:14px}
input{width:100%;margin-top:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--acc)}
.mut{color:var(--mut);font-size:12.5px;margin:6px 4px 0}
.soon{text-align:center;color:var(--mut);padding:60px 0;font-weight:700}
.soon div{font-size:56px;margin-bottom:8px}
.cta{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));border:0;border-radius:16px;padding:16px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font:inherit;font-weight:800;font-size:16px;box-shadow:0 8px 22px rgba(34,197,94,.35)}
.cta:disabled{background:var(--line);color:var(--mut);box-shadow:none}
</style>
</head>
<body>
<div class="hero">
  <div><small>BALANS</small><div class="amt" id="bal"></div></div>
  <button id="topbtn">+ To'ldirish</button>
</div>
<div class="tabs" id="tabs">
  <button data-t="stars" class="on">⭐ Stars</button>
  <button data-t="gifts">🎁 Gifts</button>
  <button data-t="top">💳 Balans</button>
  <button data-t="prem">💎 Premium</button>
</div>
<div id="view"></div>
<button class="cta" id="go" disabled>Tanlang</button>

<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
const P = new URLSearchParams(location.search);
const rate = +P.get('r') || 190, mk = +P.get('m') || 0, bal = +P.get('b') || 0;
const gifts = (P.get('g') || '').split(',').filter(Boolean).map(x => { const [id, s, e] = x.split(':'); return { id, s: +s, e: e || '🎁' }; });
const price = s => Math.ceil(s * rate * (1 + mk / 100));
const fmt = n => Math.round(n).toLocaleString('ru-RU') + " so'm";
const $ = id => document.getElementById(id);
$('bal').textContent = fmt(bal);

let pick = null;
const view = $('view'), go = $('go');
const setBtn = (t, on) => { go.textContent = t; go.disabled = !on; };
const submit = o => tg.sendData(JSON.stringify(o));
const clearSel = () => view.querySelectorAll('.item').forEach(x => x.classList.remove('sel'));

const PACKS = [
  { n: 50, e: '⭐' }, { n: 100, e: '🌟' }, { n: 250, e: '✨' },
  { n: 500, e: '💫', tag: '🔥 Mashhur' }, { n: 1000, e: '🌠' }, { n: 2500, e: '🚀' }
];

function renderStars() {
  view.innerHTML = '<div class="h">Stars paketi</div><div class="grid">' + PACKS.map(p =>
    `<div class="item" data-q="${p.n}">${p.tag ? `<div class="tag">${p.tag}</div>` : ''}<div class="tile">${p.e}</div><div class="cnt"><span>★</span> ${p.n}</div><div class="pr">${fmt(price(p.n))}</div></div>`).join('') +
    '</div><input id="cq" type="number" inputmode="numeric" placeholder="Boshqa son (kamida 50)">' +
    '<input id="un" placeholder="Oluvchi username  (@siz)" autocapitalize="none" autocomplete="off">';
  const upd = () => {
    const un = $('un').value.replace('@', '').trim();
    setBtn(pick ? `Sotib olish · ${pick}⭐ · ${fmt(price(pick))}` : 'Stars sonini tanlang',
      pick >= 50 && /^[A-Za-z0-9_]{5,32}$/.test(un));
  };
  view.querySelectorAll('.item').forEach(e => e.onclick = () => { pick = +e.dataset.q; $('cq').value = ''; clearSel(); e.classList.add('sel'); upd(); });
  $('cq').oninput = e => { pick = +e.target.value || null; clearSel(); upd(); };
  $('un').oninput = upd; upd();
  go.onclick = () => submit({ t: 'stars', q: pick, u: $('un').value.replace('@', '').trim() });
}

function renderGifts() {
  if (!gifts.length) { view.innerHTML = '<div class="soon"><div>🎁</div>Hozircha sovg\'a yo\'q</div>'; setBtn('—', false); return; }
  view.innerHTML = '<div class="h">Sovg\'ani tanlang</div><div class="grid">' + gifts.map(g =>
    `<div class="item" data-id="${g.id}"><div class="tile">${g.e}</div><div class="cnt"><span>★</span> ${g.s}</div><div class="pr">${fmt(price(g.s))}</div></div>`).join('') +
    '</div><input id="to" value="men" placeholder="Oluvchi ID yoki: men" autocomplete="off">' +
    '<div class="mut">O\'zingizga — "men". Boshqaga — uning Telegram ID raqami.</div>';
  const upd = () => { const t = $('to').value.trim().toLowerCase(); setBtn(pick ? 'Sovg\'ani sotib olish' : 'Sovg\'ani tanlang', !!pick && (t === 'men' || /^\d+$/.test(t))); };
  view.querySelectorAll('.item').forEach(e => e.onclick = () => { pick = e.dataset.id; clearSel(); e.classList.add('sel'); upd(); });
  $('to').oninput = upd; upd();
  go.onclick = () => submit({ t: 'gift', id: pick, to: $('to').value.trim() });
}

function renderTop() {
  view.innerHTML = '<div class="h">Balans to\'ldirish</div><div class="grid">' +
    [5000, 10000, 20000, 50000].map(a => `<div class="item" data-a="${a}"><div class="tile">💰</div><div class="cnt">${fmt(a)}</div></div>`).join('') +
    '</div><input id="am" type="number" inputmode="numeric" placeholder="Boshqa summa (kamida 1000)"><div class="mut">To\'lov havolasi botda chiqadi.</div>';
  const upd = () => { const a = +$('am').value; setBtn(a >= 1000 ? `To'ldirish · ${fmt(a)}` : 'Summani tanlang', a >= 1000); };
  view.querySelectorAll('.item').forEach(e => e.onclick = () => { $('am').value = e.dataset.a; clearSel(); e.classList.add('sel'); upd(); });
  $('am').oninput = () => { clearSel(); upd(); }; upd();
  go.onclick = () => submit({ t: 'top', a: +$('am').value });
}

function renderPrem() { view.innerHTML = '<div class="soon"><div>💎</div>Premium tez orada</div>'; setBtn('Tez orada', false); }

function show(t) {
  pick = null;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  ({ stars: renderStars, gifts: renderGifts, top: renderTop, prem: renderPrem })[t]();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => show(b.dataset.t));
$('topbtn').onclick = () => show('top');
show('stars');
</script>
</body>
</html>
